<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="social network, posts, DohCode, Data Gaucha, community">
    <meta name="description" content="Data Gaucha home, DohCode's social network. Browse posts, react with likes and comments, and share your own experiences.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="stylesheet" href="css/styles.css">
    <title>Home | Data Gaucha</title>
</head>
<body>
    <div class="grid">
        <header id="header">
            <form class="search-form" action="">
                <div class="input-group">
                    <button class="btn-submit" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    <input type="text" class="form-control" placeholder="Search...">
                    <button class="btn-reset" type="reset">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </form>
            <a href="html/perfil.html" class="btn-profile">
                <i id="btnUser-header" class="fa-solid fa-circle-user user-btn"></i>
                <span class="text-profile"></span>
            </a>
        </header>

        <nav id="nav" class="nav-index">
            <button class="btn-menu" type="button" id="btn-menu">
                <img src="img/DataGaucha-removebg-preview.png" alt="logo">
            </button>
            <ul>
                <li><a href="html/busqueda.html"><i class="bi bi-search"></i> Search</a></li>
                <li><a href="html/perfil.html"><i class="bi bi-person-circle"></i> Profile</a></li>
                <li><a href="html/condiciones-de-uso.html?urlCallback=../index.html"><i class="bi bi-file-text"></i> Terms of Use</a></li>
                <li><a href="html/loguear.html"><i class="bi bi-box-arrow-left"></i> Log out</a></li>
                <li><button id="darkMode">Dark mode</button></li>
            </ul>
        </nav>

        <main id="section">
            <h1 class="visually-hidden">Data Gaucha posts</h1>
            <button id="buttonModal" type="button" class="btn btn-primary btn-crear"
                    data-bs-toggle="modal" data-bs-target="#exampleModal">
                Create Post
            </button>
        </main>
    </div>

    <div id="avisoHome" class="profile-toast" role="status" aria-live="polite"></div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formCrearPost" enctype="multipart/form-data">
                        <h2>Post Title</h2>
                        <input id="tituloModal" type="text" name="title" required class="form-control mb-3">

                        <h2>Content</h2>
                        <textarea id="contenidoModal" name="body" required class="form-control mb-3"></textarea>

                        <h2>Image (optional)</h2>
                        <input id="imagenModal" type="file" name="file" class="form-control mb-3">

                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success">Accept</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Js/repositories/pedido.js"></script>
    <script src="Js/repositories/postRepositories.js"></script>
    <script src="Js/repositories/reactionRepositories.js"></script>
    <script src="Js/classes/user.js"></script>
    <script src="Js/classes/post.js"></script>
    <script src="Js/classes/toast.js"></script>
    <script src="Js/paginado.js"></script>
    <script src="Js/messages.js"></script>
    <script src="Js/darkMode.js"></script>
    <script src="Js/home.js"></script>
    <script src="Js/homePresentacion.js"></script>
</body>
</html>
