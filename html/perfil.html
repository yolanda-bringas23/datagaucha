<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="perfil, red social, seguidores, usuarios, comunidad, programación, instituto técnico, desarrollo de software">
    <meta name="description" content="Accede a tu perfil de usuario en DataGaucha. Controla tus publicaciones, revisa tu lista de seguidores y gestiona quiénes te siguen de forma rápida y sencilla.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>DataGaucha | Perfil</title>
</head>
<body class="profile-page">
    <header class="profile-nav">
        <button class="btn-menu" type="button">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>
    <nav class="nav-profile">
        <ul>
                <li><a href="../index.html"><i class="bi bi-house"></i> Home</a></li>
                <li><a href="busqueda.html"><i class="bi bi-search"></i> Búsqueda</a></li>
                <li><a href="condiciones-de-uso.html?urlCallback=perfil.html"><i class="bi bi-file-text"></i> Condiciones de uso</a></li>
                <li><a href="loguear.html"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a></li>
                <li><button id="darkMode">Darkmode</button></li>
        </ul>
    </nav>
    
    <main class="main-profile">
        <section class="profile">
            <div class="profile-top-section">
                <div class="avatar-container">
                    <img id="perfilAvatar" class="profile-avatar" src="../img/avatar.jpg" alt="Foto de perfil" width="100" height="100">
                    <button id="btnEditarPerfil" class="boton-edit" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil">Editar Perfil</button>
                </div>
                <div class="info-profile">
                    <div class="profile-edit">
                        <div id="perfilInfo">
                            <h1>Nombre de usuario</h1>
                        </div>
                    </div>

                    <div class="profile-counters">
                        <button id="btnSeguidores" type="button" data-bs-toggle="modal" data-bs-target="#modalSeguidores">0 Seguidores</button>
                        <button id="btnSeguidos" type="button" data-bs-toggle="modal" data-bs-target="#modalSeguidos">0 Siguiendo</button>
                    </div>

                    <div id="perfilAcciones" class="profile-actions"></div>
                </div> 
            </div>

        </section>
            
        <section class="post">
            <h2 id="tituloPublicaciones">Mis Publicaciones</h2>

            <div class="profile-post" id="perfilPublicaciones"></div>            
        </section>

        <section class="post">
            <h2>Comunidad</h2>
            <p class="profile-hint">Entrá al perfil de otra persona o seguila desde acá.</p>

            <div class="profile-users" id="listaComunidad"></div>
        </section>
    </main>

    <div id="avisoPerfil" class="profile-toast" role="status" aria-live="polite"></div>


    <div class="modal fade" id="modalSeguidores" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <p class="modal-title">Seguidores</p>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="listaSeguidores"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="modalSeguidos" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <p class="modal-title">Siguiendo</p>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="listaSeguidos"></div>
                </div>
            </div>
        </div>
    </div>


    <div class="modal fade" id="modalEditarPerfil" tabindex="-1" role="dialog" aria-labelledby="modalEditarPerfilLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <p class="modal-title" id="modalEditarPerfilLabel">Editar Perfil</p>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarPerfil" novalidate>
                        <div class="form-group">
                            <label for="inputAvatar">Foto de Perfil</label>
                            <input type="file" class="form-control-file" id="inputAvatar" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label for="inputNombre">Nombre Completo</label>
                            <input type="text" class="form-control" id="inputNombre" placeholder="Ej. Juan Pérez">
                        </div>
                        <div class="form-group">
                            <label for="inputUsuario">Nombre de Usuario</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text" id="arrobaprefijo">@</span>
                                </div>
                                <input type="text" class="form-control" id="inputUsuario" placeholder="usuario123" aria-describedby="arrobaprefijo">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="inputEmail">Correo Electrónico</label>
                            <input type="email" class="form-control" id="inputEmail" placeholder="correo@ejemplo.com">
                        </div>
                        <div class="form-group">
                            <label for="inputBio">Biografía</label>
                            <textarea class="form-control" id="inputBio" rows="3" maxlength="160" placeholder="Contá algo sobre vos (máximo 160 caracteres)"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="inputPassword">Nueva Contraseña</label>
                            <input type="password" class="form-control" id="inputPassword" placeholder="Déjalo en blanco para mantener la actual">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formEditarPerfil" class="btn btn-dark">Guardar Cambios</button> 
                </div>
            </div>
        </div>
    </div>

    <script src="../Js/darkMode.js"></script>
    <script src="../Js/condicionesDeUso.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="../Js/repositories/userRepositories.js"></script>
    <script src="../Js/repositories/postRepositories.js"></script>
    <script src="../Js/classes/user.js"></script>
    <script src="../Js/classes/post.js"></script>
    <script src="../Js/classes/toast.js"></script>
    <script src="../Js/perfilPresentation.js"></script>
</body>
</html>
