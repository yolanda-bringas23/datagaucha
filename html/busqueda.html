    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16x16.png">
    <title>Búsqueda | Data Gaucha</title>

<body>

    <div class="grid">

        
        <nav id="nav" class="nav-index">
            <button class="btn-menu" type="button">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul>
                <li><a href="../index.html"><i class="bi bi-house"></i> Home</a></li>
                <li><a href="perfil.html"><i class="bi bi-person-circle"></i> Perfil</a></li>
                <li><a href="condiciones-de-uso.html"><i class="bi bi-file-text"></i> Condiciones</a></li>

                    <button class="btn-submit" type="submit">

                    </button>
                    
                    <input type="text" class="form-control" name="search" placeholder="Buscar...">
                    <button class="btn-reset" type="reset">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </form>

            
            <a href="perfil.html" class="btn-profile">
                <i class="fa-solid fa-circle-user user-btn"></i>
                <span class="text-profile"></span>
            </a>

        </header>

        <section id="section">
            <h1 id="searchTitle" class="search-title" hidden>Resultados encontrados</h1>
            <div id="searchResults"></div>
            
            
            <p class="p-index" style="text-align: center; margin-top: 2rem; padding-bottom: 2rem;">© DohCode 2026</p>
        </section>
